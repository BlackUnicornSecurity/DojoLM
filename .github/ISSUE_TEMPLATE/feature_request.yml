name: Feature request
description: Propose new functionality or an improvement
title: "[feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues and discussions before filing. For new detection
        patterns or fixture categories, describe the attack class and include (redacted)
        example inputs where possible.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who hits it, and when?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Sketch the UX/API if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Scanner engine (bu-tpi)
        - Web application (dojolm-web)
        - MCP adversarial server (dojolm-mcp)
        - SDK / verifier CLI (dojolm-sdk)
        - Documentation
        - Other
    validations:
      required: true
