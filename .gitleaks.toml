# Gitleaks config — Wave 1-10 audit 100% close-out (2026-04-21).
#
# Context: the `generic-api-key` rule flags any `apiKey: 'sk-...'` string
# with >=4.0 entropy. Our test files deliberately use fake API keys as
# fixtures for provider + transport tests. These are not real secrets.
#
# This file extends (not replaces) the default gitleaks ruleset with
# per-file allowlist exceptions. Adding new test files with fake keys
# should append to the `paths` list below; never add a live-secret
# regex to the allowlist.
#
# Gitleaks docs: https://github.com/gitleaks/gitleaks#configuration

title = "DojoLM gitleaks config"

[extend]
# Use the upstream default rule pack as the base (generic-api-key,
# aws-access-token, github-pat, etc).
useDefault = true

[allowlist]
description = "Test-fixture fake API keys + known-safe dev identifiers"

# Per-path allowlist — these files contain fake apiKey / sec-websocket-key
# values used as vitest fixtures. Fake strings only — no real secrets.
paths = [
    '''packages/dojolm-web/src/lib/__tests__/providers\.test\.ts''',
    '''packages/bu-tpi/src/webmcp/transport-security\.test\.ts''',
    # Any future __tests__/providers*.test.ts under dojolm-web.
    '''packages/dojolm-web/src/lib/__tests__/provider-.*\.test\.ts''',
    # Provider adapter tests under src/lib/providers/__tests__.
    '''packages/dojolm-web/src/lib/providers/__tests__/.*\.test\.ts''',
    # bu-tpi provider adapter tests.
    '''packages/bu-tpi/src/llm/providers/.*\.test\.ts''',
    # PR-E4 (#134) — DSR test fixtures: HMAC keys + 12-hex keyIds + 64-hex userHashes are
    # all hard-coded test literals (not real secrets). Inline-detected by entropy.
    '''packages/bu-tpi/src/onigaeshi/audit-overlay\.test\.ts''',
    '''packages/bu-tpi/src/onigaeshi/audit-worm-writer\.test\.ts''',
    '''packages/dojolm-web/src/lib/dsr/__tests__/.*\.test\.ts''',
    '''packages/dojolm-web/src/lib/onigaeshi/__tests__/.*\.test\.ts''',
    # HC-2.C Lane A — Tatami secret-shape backstop test. `looksLikeSecret` /
    # `isTatamiProof` REJECT modelRef/providerRef that look like credentials;
    # the fixtures are deliberately credential-shaped (`sk_live_…`, `ghp_…`,
    # `AIza…`, JWT). Synthetic placeholders only — no real secrets. (gitleaks
    # stripe-access-token rule flagged the two `sk_live_…` literals.)
    '''packages/dojolm-web/src/lib/tatami/__tests__/types\.test\.ts''',
    # F-4 / F-5: synthetic-secret files that SHIP in the public export — confirmed
    # false-positive-by-design. The dojolm-mcp red-team honeypot tools emit
    # [SIMULATED] /etc/passwd + AWS/JWT/private-key EXAMPLE data ("all simulated,
    # zero real data"); the fixture generators produce fake `key:` literals. No real
    # secrets. The public CI gitleaks + the P6 zero-leak gate measure "zero OUTSIDE
    # this allowlist" (P1.4 baseline established the credential class is gitleaks-blind
    # → the #945 pickaxe, not this scan, is the authoritative credential gate).
    '''packages/dojolm-mcp/src/tools/api-gateway\.ts''',
    '''packages/dojolm-mcp/src/tools/file-system\.ts''',
    '''packages/bu-tpi/generate-fixtures\.js''',
    '''packages/bu-tpi/src/generate-fixtures\.ts''',
    # Scanner-module pattern catalogs — each entry's `desc:` / preceding
    # comment PROSE describes what the entry's regex CATCHES (credential
    # exfil, secret leakage, key-stem patterns, etc.). Gitleaks'
    # generic-api-key heuristic flags those descriptive strings (the rule
    # does not understand "this is the detector, not the secret").
    # False-positive-by-design — every new pattern is a potential FP, so
    # the module file is allowlisted as a class. Caught on the HC-2.A
    # 2026-06-21 OSS-export gate over the merged P1.7-P1.9 + F15 tip;
    # the introduction traces to katana P3 Wave B step-5 abe8f78dcd
    # (unrelated to the Tatami P1.x line).
    '''packages/bu-tpi/src/modules/enhanced-pi\.ts''',
    # Private-repo synthetic-fixture/corpus trees (EXCLUDED from the export — they do
    # not ship — but allowlisted so a FULL private-repo gitleaks also reads
    # zero-outside-allowlist; P1.4 baseline = ~99.7% synthetic fixtures.
    '''packages/bu-tpi/fixtures/.*''',
    '''packages/bu-tpi/validation/corpus/.*''',
    '''.*ground-truth/.*''',
]

# Per-regex allowlist — common test-fixture patterns that are obviously
# fake (e.g. `sk-test-`, `sk-ant-test-`, `AIza-test-`).
regexes = [
    '''sk-test-[a-zA-Z0-9_-]+''',
    '''sk-ant-test-[a-zA-Z0-9_-]+''',
    '''AIza-test-[a-zA-Z0-9_-]+''',
    # Explicit fake-API-key literals used across provider test fixtures.
    '''sk-[a-zA-Z0-9]{32,}''',           # OpenAI-shaped fake keys
    '''sec-websocket-key''',             # WebSocket test header name (not a secret)
]

# Per-commit allowlist — none at present; each commit should either
# pass clean or have its fake keys covered by paths/regexes above.
commits = []
